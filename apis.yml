aid: geneos-therapeutics
name: Geneos Therapeutics
description: 'Geneos Therapeutics is a clinical-stage (Phase 2b) biotherapeutics company
  in Philadelphia, Pennsylvania developing DNA-based personalized immunotherapies for
  cancer (PICs). Its GT-EPIC neoantigen-targeting platform sequences a patient''s tumor,
  identifies the targetable neoantigens, and encodes up to roughly 40 of them into a
  synthetic DNA plasmid drug product delivered intradermally alongside a plasmid-encoded
  IL-12 adjuvant and CELLECTRA electroporation. Geneos was spun out of Inovio Pharmaceuticals
  and licenses that immunotherapy platform exclusively; it has run clinical work in
  hepatocellular carcinoma (HCC) and glioblastoma (GBM) and is advancing toward a Phase
  2b HCC trial. Geneos is a therapeutics developer, not a software vendor: it publishes
  no public API, SDK, developer portal or machine-readable contract of any kind.'
